name: Apply job fencing fix

on:
  push:
    branches:
      - review/deepseek-harness-migration-2026-08-20

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-job-fencing-fix]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/deepseek-harness-migration-2026-08-20
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Repair staged fencing script
        run: python3 scripts/repair_job_fencing_script.py

      - name: Apply fencing fix
        run: python3 scripts/apply_job_fencing_fix.py

      - name: Install dependencies
        run: npm exec --yes -- pnpm@10.12.1 install --frozen-lockfile

      - name: Format changed files
        run: |
          npm exec --yes -- pnpm@10.12.1 exec prettier --write \
            packages/core/src/session/job-runner.ts \
            packages/core/src/session/workflow-job-executor.ts \
            packages/core/src/workflow/node-executor.ts \
            packages/core/__tests__/phase1/session-job-e2e.test.ts \
            docs/reviews/2026-08-25-tekon-harness-replatform-second-review.md

      - name: Build and typecheck
        run: |
          npm exec --yes -- pnpm@10.12.1 build
          npm exec --yes -- pnpm@10.12.1 typecheck

      - name: Run full Core unit suite
        run: npm exec --yes -- pnpm@10.12.1 --filter @tekon/core test:unit

      - name: Run Core e2e suite
        run: npm exec --yes -- pnpm@10.12.1 --filter @tekon/core test:e2e

      - name: Lint and diff check
        run: |
          npm exec --yes -- pnpm@10.12.1 lint
          git diff --check

      - name: Commit and push fix
        run: |
          set -euo pipefail
          git config user.name "openai-review-agent"
          git config user.email "openai-review-agent@users.noreply.github.com"
          git add -- \
            packages/core/src/session/job-runner.ts \
            packages/core/src/session/workflow-job-executor.ts \
            packages/core/src/workflow/node-executor.ts \
            packages/core/__tests__/phase1/session-job-e2e.test.ts \
            docs/reviews/2026-08-25-tekon-harness-replatform-second-review.md
          git rm -f -- \
            .github/workflows/apply-job-fencing-fix.yml \
            scripts/apply_job_fencing_fix.py \
            scripts/repair_job_fencing_script.py
          git diff --cached --check
          git commit -m "fix: separate cancellation from ownership fencing"
          git push origin HEAD:review/deepseek-harness-migration-2026-08-20
