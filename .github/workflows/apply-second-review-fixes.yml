name: Apply second review fixes

on:
  push:
    branches:
      - review/deepseek-harness-migration-2026-08-20

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-second-review-fixes]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/deepseek-harness-migration-2026-08-20
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Repair staged review script
        run: python3 scripts/patch_second_review_script.py

      - name: Apply reviewed changes
        run: python3 scripts/apply_second_review_fixes.py

      - name: Install dependencies
        run: npm exec --yes -- pnpm@10.12.1 install --frozen-lockfile

      - name: Format changed files
        run: |
          npm exec --yes -- pnpm@10.12.1 exec prettier --write \
            packages/core/src/session/job-runner.ts \
            packages/core/__tests__/session/job-runner.test.ts \
            packages/cli/src/commands/approval.ts \
            packages/cli/__tests__/approval-terminal.test.ts \
            packages/cli/__tests__/e2e/cli-flow.test.ts \
            packages/core/src/session/workflow-job-executor.ts \
            packages/core/src/session/session-store.ts \
            packages/core/__tests__/session/session-store.test.ts \
            packages/web/src/server/sse.ts \
            packages/web/__tests__/api/session-sse.test.ts \
            packages/core/src/runtime/agent-adapter.ts \
            packages/core/src/runtime/dsh-headless-adapter.ts \
            packages/core/__tests__/runtime/dsh-headless-adapter.test.ts \
            packages/core/src/runtime/agent-step-events.ts \
            packages/core/__tests__/runtime/agent-step-events.test.ts \
            packages/web/src/client/lib/event-feed.ts \
            packages/web/__tests__/client/event-feed.test.ts \
            packages/web/src/client/components/sessions/EventFeed.tsx \
            packages/web/src/client/styles/sessions.css \
            packages/web/src/client/layouts/Sidebar.tsx \
            packages/web/src/client/pages/SessionsPage.tsx \
            packages/web/src/client/pages/SessionDetailPage.tsx \
            docs/reviews/2026-08-20-tekon-human-usability-and-deepseek-harness-migration-review.md \
            docs/reviews/2026-08-25-tekon-harness-replatform-second-review.md

      - name: Normalize review markdown
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for filename in (
              "docs/reviews/2026-08-20-tekon-human-usability-and-deepseek-harness-migration-review.md",
              "docs/reviews/2026-08-25-tekon-harness-replatform-second-review.md",
          ):
              path = Path(filename)
              lines = path.read_text(encoding="utf-8").splitlines()
              path.write_text("\n".join(line.rstrip() for line in lines) + "\n", encoding="utf-8")
          PY

      - name: Build and typecheck
        run: |
          npm exec --yes -- pnpm@10.12.1 build
          npm exec --yes -- pnpm@10.12.1 typecheck

      - name: Run focused Core tests
        run: |
          npm exec --yes -- pnpm@10.12.1 --filter @tekon/core exec vitest run \
            __tests__/session/job-runner.test.ts \
            __tests__/session/session-store.test.ts \
            __tests__/runtime/dsh-headless-adapter.test.ts \
            __tests__/runtime/agent-step-events.test.ts

      - name: Run focused Web tests
        run: |
          npm exec --yes -- pnpm@10.12.1 --filter @tekon/web exec vitest run \
            __tests__/api/session-sse.test.ts \
            __tests__/client/event-feed.test.ts

      - name: Run focused CLI tests and CLI e2e
        run: |
          npm exec --yes -- pnpm@10.12.1 --filter @tekon/cli exec vitest run \
            __tests__/approval-terminal.test.ts
          npm exec --yes -- pnpm@10.12.1 --filter @tekon/cli test:e2e

      - name: Lint and diff check
        run: |
          npm exec --yes -- pnpm@10.12.1 lint
          git diff --check

      - name: Commit and push reviewed fixes
        run: |
          set -euo pipefail
          git config user.name "openai-review-agent"
          git config user.email "openai-review-agent@users.noreply.github.com"
          git add -- \
            packages/core/src/session/job-runner.ts \
            packages/core/__tests__/session/job-runner.test.ts \
            packages/cli/src/commands/approval.ts \
            packages/cli/__tests__/approval-terminal.test.ts \
            packages/cli/__tests__/e2e/cli-flow.test.ts \
            packages/core/src/session/workflow-job-executor.ts \
            packages/core/src/session/session-store.ts \
            packages/core/__tests__/session/session-store.test.ts \
            packages/web/src/server/sse.ts \
            packages/web/__tests__/api/session-sse.test.ts \
            packages/core/src/runtime/agent-adapter.ts \
            packages/core/src/runtime/dsh-headless-adapter.ts \
            packages/core/__tests__/runtime/dsh-headless-adapter.test.ts \
            packages/core/src/runtime/agent-step-events.ts \
            packages/core/__tests__/runtime/agent-step-events.test.ts \
            packages/web/src/client/lib/event-feed.ts \
            packages/web/__tests__/client/event-feed.test.ts \
            packages/web/src/client/components/sessions/EventFeed.tsx \
            packages/web/src/client/styles/sessions.css \
            packages/web/src/client/layouts/Sidebar.tsx \
            packages/web/src/client/pages/SessionsPage.tsx \
            packages/web/src/client/pages/SessionDetailPage.tsx \
            docs/reviews/2026-08-20-tekon-human-usability-and-deepseek-harness-migration-review.md \
            docs/reviews/2026-08-25-tekon-harness-replatform-second-review.md
          git rm -f -- \
            .github/workflows/apply-second-review-fixes.yml \
            scripts/apply_second_review_fixes.py \
            scripts/patch_second_review_script.py
          git diff --cached --check
          git commit -m "fix: address second Harness replatform review"
          git push origin HEAD:review/deepseek-harness-migration-2026-08-20
