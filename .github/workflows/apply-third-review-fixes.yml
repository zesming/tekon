name: Apply third review fixes

on:
  push:
    branches:
      - review/deepseek-harness-migration-2026-08-20

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-third-review-fixes]')
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/deepseek-harness-migration-2026-08-20
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate and apply reviewed changes
        run: |
          python3 -m py_compile scripts/apply_third_review_fixes.py
          python3 scripts/apply_third_review_fixes.py

      - name: Install dependencies
        run: npm exec --yes -- pnpm@10.12.1 install --frozen-lockfile

      - name: Format changed files
        run: |
          npm exec --yes -- pnpm@10.12.1 exec prettier --write \
            packages/core/src/session/job-runner.ts \
            packages/core/src/workflow/engine.ts \
            packages/core/src/workflow/node-executor.ts \
            packages/core/src/workflow/gate-runner.ts \
            packages/core/src/workflow/rework.ts \
            packages/core/__tests__/session/job-runner-stop-fencing.test.ts \
            packages/core/__tests__/workflow/ownership-fencing.e2e.test.ts \
            packages/core/__tests__/workflow/engine-gate-repair.e2e.test.ts \
            docs/reviews/2026-08-25-tekon-harness-replatform-second-review.md

      - name: Build and typecheck
        run: |
          npm exec --yes -- pnpm@10.12.1 build
          npm exec --yes -- pnpm@10.12.1 typecheck

      - name: Run focused fencing tests
        run: |
          npm exec --yes -- pnpm@10.12.1 --filter @tekon/core exec vitest run \
            __tests__/session/job-runner-stop-fencing.test.ts \
            __tests__/workflow/ownership-fencing.e2e.test.ts \
            __tests__/workflow/engine-recovery.e2e.test.ts \
            __tests__/workflow/engine-gate-repair.e2e.test.ts \
            __tests__/workflow/engine-rework.e2e.test.ts

      - name: Run full Core suites
        run: |
          npm exec --yes -- pnpm@10.12.1 --filter @tekon/core test:unit
          npm exec --yes -- pnpm@10.12.1 --filter @tekon/core test:e2e

      - name: Lint and diff check
        run: |
          npm exec --yes -- pnpm@10.12.1 lint
          git diff --check

      - name: Commit and push fixes
        run: |
          set -euo pipefail
          git config user.name "openai-review-agent"
          git config user.email "openai-review-agent@users.noreply.github.com"
          git add -- \
            packages/core/src/session/job-runner.ts \
            packages/core/src/workflow/engine.ts \
            packages/core/src/workflow/node-executor.ts \
            packages/core/src/workflow/gate-runner.ts \
            packages/core/src/workflow/rework.ts \
            packages/core/__tests__/session/job-runner-stop-fencing.test.ts \
            packages/core/__tests__/workflow/ownership-fencing.e2e.test.ts \
            packages/core/__tests__/workflow/engine-gate-repair.e2e.test.ts \
            docs/reviews/2026-08-25-tekon-harness-replatform-second-review.md
          git rm -f -- \
            .github/workflows/apply-third-review-fixes.yml \
            scripts/apply_third_review_fixes.py
          git diff --cached --check
          git commit -m "fix: close third-review ownership fencing gaps"
          git push origin HEAD:review/deepseek-harness-migration-2026-08-20
