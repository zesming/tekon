name: CI

# Full-stack CI covering core + CLI + Web + Playwright (report P1-06 / §13.13).
# core.yml remains the focused core gate; this workflow adds the layers that
# most affect human usability and were previously unprotected on the main
# branch: root typecheck/lint, CLI build/unit/e2e, Web build/typecheck/unit,
# and the browser (Playwright) journeys.

on:
  push:
    branches:
      - main
      - rebuild-v2
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10.12.1'
  NODE_VERSION: '24'

jobs:
  typecheck:
    name: Root typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm exec --yes -- pnpm@10.12.1 install --frozen-lockfile

      - name: Build all packages
        run: npm exec --yes -- pnpm@10.12.1 -r build

      - name: Typecheck all packages
        run: npm exec --yes -- pnpm@10.12.1 -r typecheck

  cli:
    name: CLI build + unit + e2e
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm exec --yes -- pnpm@10.12.1 install --frozen-lockfile

      - name: Build core + CLI
        run: |
          npm exec --yes -- pnpm@10.12.1 --filter @tekon/core build
          npm exec --yes -- pnpm@10.12.1 --filter @tekon/cli build

      - name: CLI unit tests
        run: npm exec --yes -- pnpm@10.12.1 --filter @tekon/cli test:unit

      - name: CLI e2e tests
        run: npm exec --yes -- pnpm@10.12.1 --filter @tekon/cli test:e2e

  web:
    name: Web build + typecheck + unit
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm exec --yes -- pnpm@10.12.1 install --frozen-lockfile

      - name: Build core (web depends on it)
        run: npm exec --yes -- pnpm@10.12.1 --filter @tekon/core build

      - name: Web typecheck
        run: npm exec --yes -- pnpm@10.12.1 --filter @tekon/web typecheck

      - name: Web build
        run: npm exec --yes -- pnpm@10.12.1 --filter @tekon/web build

      - name: Web unit tests
        run: npm exec --yes -- pnpm@10.12.1 --filter @tekon/web test

  web-e2e:
    name: Web Playwright e2e
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm exec --yes -- pnpm@10.12.1 install --frozen-lockfile

      - name: Build core (web depends on it)
        run: npm exec --yes -- pnpm@10.12.1 --filter @tekon/core build

      - name: Install Playwright browser (chromium)
        run: npm exec --yes -- pnpm@10.12.1 --filter @tekon/web exec playwright install --with-deps chromium

      - name: Web Playwright e2e
        run: npm exec --yes -- pnpm@10.12.1 --filter @tekon/web test:e2e
