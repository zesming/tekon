name: CI

# One install verifies the whole repo on the primary Node version; the matrix
# re-checks the declared engine floors; Playwright runs in parallel. ci-ok is
# the single required check for merging into main.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only pull requests cancel superseded runs; on main a cancelled run would
  # make ci-ok (always()) report a failure.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  # pnpm 版本由根 package.json 的 packageManager 字段钉死。
  # 每个 job 都先启用 Corepack shim，因为 package script 可能递归调用裸 pnpm。

jobs:
  verify:
    name: Verify (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint workflow files
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Check installer syntax
        run: bash -n scripts/install.sh

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pinned pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify native dependency builds
        run: |
          set -euo pipefail
          ignored="$(pnpm ignored-builds)"
          echo "$ignored"
          echo "$ignored" | grep -Eq "^[[:space:]]*None[[:space:]]*$"

      - name: Build all packages
        run: pnpm -r build

      - name: Typecheck all packages
        run: pnpm -r typecheck

      - name: Unit and e2e tests (core, CLI, Web)
        run: pnpm test --run

      - name: CLI binary smoke
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          test "$(node packages/cli/dist/index.js --version)" = "$expected"
          node packages/cli/dist/index.js --help >/dev/null

  # Re-check each declared engine floor. Node 24 is covered by verify.
  node-compat:
    name: Node compatibility (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.19.0', '22.12.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Assert resolved Node version
        env:
          EXPECTED_NODE_VERSION: ${{ matrix.node-version }}
        run: |
          node -e '
            const expected = process.env.EXPECTED_NODE_VERSION;
            const actual = process.versions.node;
            console.log("Resolved Node version: " + actual + " (expected: " + expected + ")");
            if (actual !== expected) {
              throw new Error("Node version mismatch: expected " + expected + ", got " + actual);
            }
          '

      # Node 22.12 bundles Corepack 0.29, whose pnpm signing keys predate the
      # pinned pnpm 10 release. Pin a Corepack version that supports every leg.
      - name: Install compatible Corepack
        run: npm install --global corepack@0.34.1

      - name: Enable pinned pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Core unit tests
        run: pnpm --filter @tekon/core test:unit

      - name: CLI unit tests
        run: pnpm --filter @tekon/cli test:unit

      - name: CLI binary smoke
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          test "$(node packages/cli/dist/index.js --version)" = "$expected"
          node packages/cli/dist/index.js --help >/dev/null

  web-e2e:
    name: Web Playwright e2e
    # Playwright cannot install browsers on the ubuntu-latest 26.04 image yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pinned pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core (web depends on it)
        run: pnpm --filter @tekon/core build

      - name: Install Playwright browser (chromium)
        run: pnpm --filter @tekon/web exec playwright install --with-deps chromium

      - name: Web Playwright e2e
        run: pnpm --filter @tekon/web test:e2e

  ci-ok:
    name: CI OK
    if: always()
    needs: [verify, node-compat, web-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          read -r -a results <<< "$RESULTS"
          [ "${#results[@]}" -eq 3 ] || { echo "Expected 3 job results, got ${#results[@]}"; exit 1; }
          for result in "${results[@]}"; do
            [ "$result" = success ] || exit 1
          done
