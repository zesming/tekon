name: CI

# Full-stack CI covering core + CLI + Web + Playwright (report P1-06 / §13.13).
# core.yml remains the focused core gate; this workflow adds the layers that
# most affect human usability and were previously unprotected on the main
# branch: root typecheck/lint, CLI build/unit/e2e, Web build/typecheck/unit,
# and the browser (Playwright) journeys.

on:
  push:
    branches:
      - main
      - rebuild-v2
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # pnpm 版本由根 package.json 的 packageManager 字段钉死。
  # 每个 job 都先启用 Corepack shim，因为 package script 可能递归调用裸 pnpm。

jobs:
  typecheck:
    name: Root typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check installer syntax
        run: bash -n scripts/install.sh

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pinned pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Typecheck all packages
        run: pnpm -r typecheck

      - name: Audit production dependencies
        run: pnpm audit --prod

  cli:
    name: CLI build + unit + e2e
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pinned pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core + CLI
        run: |
          pnpm --filter @tekon/core build
          pnpm --filter @tekon/cli build

      - name: CLI unit tests
        run: pnpm --filter @tekon/cli test:unit

      - name: CLI e2e tests
        run: pnpm --filter @tekon/cli test:e2e

  web:
    name: Web build + typecheck + unit
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pinned pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core (web depends on it)
        run: pnpm --filter @tekon/core build

      - name: Web typecheck
        run: pnpm --filter @tekon/web typecheck

      - name: Web build
        run: pnpm --filter @tekon/web build

      - name: Web unit tests
        run: pnpm --filter @tekon/web test

  web-e2e:
    name: Web Playwright e2e
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pinned pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core (web depends on it)
        run: pnpm --filter @tekon/core build

      - name: Install Playwright browser (chromium)
        run: pnpm --filter @tekon/web exec playwright install --with-deps chromium

      - name: Web Playwright e2e
        run: pnpm --filter @tekon/web test:e2e
