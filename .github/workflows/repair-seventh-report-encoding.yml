name: Repair seventh review report encoding

on:
  push:
    branches:
      - review/deepseek-harness-migration-2026-08-20

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair-seventh-report-encoding]')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/deepseek-harness-migration-2026-08-20
          fetch-depth: 0

      - name: Verify staged payload
        run: |
          set -euo pipefail
          test "$(sha256sum .tmp/seventh-report/part-00 | awk '{print $1}')" = "1aedfd458008f6088218b3ae428fa83e845e5d7289f7b9f21de0b5980a17c9fc"
          test "$(sha256sum .tmp/seventh-report/part-01 | awk '{print $1}')" = "c7f6e47452fb3779e3b7d9e9dff7bdafd9b289f8b9e496f4b36c07f8bd754827"
          test "$(sha256sum .tmp/seventh-report/part-04 | awk '{print $1}')" = "aa911589fa46269c4eea73caf3a7dda11902e627ae7d86be5339ad871049a116"
          test "$(sha256sum .tmp/seventh-report/part-05 | awk '{print $1}')" = "c6bb457e1ae9afc71a35b121dcfbef26324891a9ad2738e7ee29b928941c5672"
          test "$(sha256sum .tmp/seventh-report/part-06 | awk '{print $1}')" = "00c424b1d86050722c86cadbad43e52cfa2c5a90ee363ef1542b2d7fd4f8fe11"

          test "$(sha256sum .tmp/seventh-report/sub/part-02-00 | awk '{print $1}')" = "98fedc073da86431ec9e6b690d2b4f42180e86fcdd17b9a6dc9b871308793b0c"
          test "$(sha256sum .tmp/seventh-report/sub/part-02-01 | awk '{print $1}')" = "7b4dd3f7e021333a625e5d4d8afbe9c54a674d7fbe830f7cb15791fd032f13f3"
          test "$(sha256sum .tmp/seventh-report/sub/part-02-02 | awk '{print $1}')" = "c92b6d942265caae18c8738ab25dab813c54025fac121712c519682fe0bffec6"
          test "$(sha256sum .tmp/seventh-report/sub/part-02-03 | awk '{print $1}')" = "e3a7951a3344d06c67cc1ce4f3d5734dcb9aa2fdebaa2926ca9220571d4aef0f"
          test "$(sha256sum .tmp/seventh-report/sub/part-02-04 | awk '{print $1}')" = "57732cc632b8731379a272fc2a60e8e6061654c33a43d2d8ffd8c1c34adb4550"
          test "$(sha256sum .tmp/seventh-report/sub/part-02-05 | awk '{print $1}')" = "20ccff72a7115ee31e9d53bb9ca017380cbfad1d0299ab10c870adb8e3db95db"

          test "$(sha256sum .tmp/seventh-report/sub/part-03-00 | awk '{print $1}')" = "ddca4fddcf5e8bdeff2bb804f188086b7b741bb33b352e897133acb5a0ad7acc"
          test "$(sha256sum .tmp/seventh-report/sub/part-03-01 | awk '{print $1}')" = "6720c59075d2cea84338bc2a5166df21fe1009a570cba6df7da21c7bf77290b7"
          test "$(sha256sum .tmp/seventh-report/sub/part-03-02 | awk '{print $1}')" = "3461073a35d26e4a5ffcadd06d2e31f06db390368aa9154525e96f8416679599"
          test "$(sha256sum .tmp/seventh-report/sub/part-03-03 | awk '{print $1}')" = "65d4eaee312d2734e835d5be4488de762c21ebf682a0539e0a7d110da7d65cea"
          test "$(sha256sum .tmp/seventh-report/sub/part-03-04 | awk '{print $1}')" = "ed18a9ebafa6564a43628c9ef76726dea9ea46e339e40ec086761bdbdacc395f"
          test "$(sha256sum .tmp/seventh-report/sub/part-03-05 | awk '{print $1}')" = "68fac4178fbdaa6b8e4b6075d3e162c6e06b22e836fc6adfc45d161d5c032c35"

          test "$(sha256sum .tmp/seventh-report/sub/part-07-00 | awk '{print $1}')" = "ba17b49bb7c8f3b1e3ede37e12388b05bac1e7c319cd6f552beee013dcf8fd7c"
          test "$(sha256sum .tmp/seventh-report/sub/part-07-01 | awk '{print $1}')" = "7f7cd7ab33032eab8f4c2f75ced98284763c0a7a0bffc20abff6542c7445f39b"
          test "$(sha256sum .tmp/seventh-report/sub/part-07-02 | awk '{print $1}')" = "4ba2b77b74121f99ee6a5efa2bb61304e3252620a0885cdad741a03215cbb043"

      - name: Decode authoritative UTF-8 report
        run: |
          set -euo pipefail
          {
            cat .tmp/seventh-report/part-00
            cat .tmp/seventh-report/part-01
            cat .tmp/seventh-report/sub/part-02-*
            cat .tmp/seventh-report/sub/part-03-*
            cat .tmp/seventh-report/part-04
            cat .tmp/seventh-report/part-05
            cat .tmp/seventh-report/part-06
            cat .tmp/seventh-report/sub/part-07-*
          } | base64 --decode > docs/reviews/2026-08-26-tekon-harness-replatform-seventh-review.md
          actual="$(sha256sum docs/reviews/2026-08-26-tekon-harness-replatform-seventh-review.md | awk '{print $1}')"
          test "$actual" = "3f094bbc8bb238b49383c1c43bd37147dc9673d760090abf56c3fb814a8ce2bc"

      - name: Verify and commit authoritative report
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/reviews/2026-08-26-tekon-harness-replatform-seventh-review.md')
          text = path.read_text(encoding='utf-8')
          assert text.startswith('# Tekon Harness Replatform 第七轮全面复审')
          assert '整体不通过' in text
          assert 'F7-P0-01' in text
          assert 'aefa08e144ef0b8381355ed913e95064f22ae718' in text
          assert '[readiness] enqueue failed' in text
          assert '移动端横向溢出已关闭' in text
          PY
          git config user.name "openai-review-agent"
          git config user.email "openai-review-agent@users.noreply.github.com"
          git add docs/reviews/2026-08-26-tekon-harness-replatform-seventh-review.md
          git rm -rf .tmp/seventh-report .github/workflows/repair-seventh-report-encoding.yml
          git diff --cached --check
          git commit -m "docs: install authoritative seventh-round review"
          git push origin HEAD:review/deepseek-harness-migration-2026-08-20
