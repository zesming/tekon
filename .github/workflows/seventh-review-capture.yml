name: Seventh review capture

on:
  push:
    branches:
      - review/deepseek-harness-migration-2026-08-20

permissions:
  contents: write

jobs:
  capture:
    if: contains(github.event.head_commit.message, '[seventh-review-capture]')
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/deepseek-harness-migration-2026-08-20
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm exec --yes -- pnpm@10.12.1 install --frozen-lockfile

      - name: Build Core
        run: npm exec --yes -- pnpm@10.12.1 --filter @tekon/core build

      - name: Install Chromium
        run: npm exec --yes -- pnpm@10.12.1 --filter @tekon/web exec playwright install --with-deps chromium

      - name: Create audit spec
        run: |
          cat > packages/web/__tests__/e2e/seventh-review-capture.test.ts <<'TS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { test, expect } from './shared-fixture.js';

          test.setTimeout(90_000);

          const outDir = path.resolve(process.cwd(), '../../seventh-review-artifacts');
          fs.mkdirSync(outDir, { recursive: true });

          async function startRun(baseUrl: string, token: string) {
            const response = await fetch(`${baseUrl}/api/rpc`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-session-token': token,
              },
              body: JSON.stringify({
                path: 'project.run',
                input: {
                  demandText: '第七轮审查：验证移动端与长会话信息架构。',
                  template: 'standard-delivery',
                  agent: 'mock',
                  token,
                },
              }),
            });
            expect(response.ok).toBe(true);
            const body = (await response.json()) as {
              result: { run: { id: string }; sessionId?: string };
            };
            expect(body.result.sessionId).toBeTruthy();
            return { runId: body.result.run.id, sessionId: body.result.sessionId! };
          }

          async function waitForPassed(baseUrl: string, runId: string, token: string) {
            const deadline = Date.now() + 45_000;
            while (Date.now() < deadline) {
              const response = await fetch(`${baseUrl}/api/rpc`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-session-token': token,
                },
                body: JSON.stringify({ path: 'project.overview' }),
              });
              if (response.ok) {
                const body = (await response.json()) as {
                  result: { latestRun: { id: string; status: string } | null };
                };
                if (body.result.latestRun?.id === runId && body.result.latestRun.status === 'passed') {
                  return;
                }
              }
              await new Promise((resolve) => setTimeout(resolve, 100));
            }
            throw new Error(`run ${runId} did not pass`);
          }

          async function metrics(page: import('@playwright/test').Page, label: string) {
            const value = await page.evaluate(() => ({
              viewport: { width: window.innerWidth, height: window.innerHeight },
              document: {
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                scrollHeight: document.documentElement.scrollHeight,
                clientHeight: document.documentElement.clientHeight,
              },
              bodyOverflow: getComputedStyle(document.body).overflow,
              activeElement: document.activeElement instanceof HTMLElement
                ? {
                    tag: document.activeElement.tagName,
                    text: document.activeElement.innerText || document.activeElement.getAttribute('aria-label') || '',
                    ariaLabel: document.activeElement.getAttribute('aria-label'),
                  }
                : null,
            }));
            fs.writeFileSync(path.join(outDir, `${label}.json`), JSON.stringify(value, null, 2));
          }

          test('capture current product surfaces and drawer keyboard behavior', async ({ page, server, fixture }) => {
            const { runId, sessionId } = await startRun(server.url, fixture.sessionToken);
            await waitForPassed(server.url, runId, fixture.sessionToken);

            await page.setViewportSize({ width: 1440, height: 1000 });
            await page.goto(server.url);
            await expect(page.getByRole('heading', { name: '受控交付' })).toBeVisible();
            await page.screenshot({ path: path.join(outDir, '01-delivery-list-desktop.png'), fullPage: true });
            await metrics(page, '01-delivery-list-desktop');

            await page.goto(`${server.url}/sessions/${sessionId}`);
            await expect(page.locator('.event-feed')).toBeVisible();
            await page.screenshot({ path: path.join(outDir, '02-delivery-detail-desktop.png'), fullPage: true });
            await metrics(page, '02-delivery-detail-desktop');

            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto(server.url);
            await expect(page.getByRole('heading', { name: '受控交付' })).toBeVisible();
            await page.screenshot({ path: path.join(outDir, '03-delivery-list-mobile.png'), fullPage: true });
            await metrics(page, '03-delivery-list-mobile');

            const open = page.getByRole('button', { name: '打开导航' });
            await open.click();
            await expect(page.locator('#app-sidebar')).toBeVisible();
            await page.screenshot({ path: path.join(outDir, '04-mobile-drawer-open.png'), fullPage: true });
            await metrics(page, '04-mobile-drawer-open-before-tab');

            const focusSequence = [];
            for (let i = 0; i < 5; i += 1) {
              await page.keyboard.press('Tab');
              focusSequence.push(await page.evaluate(() => {
                const el = document.activeElement as HTMLElement | null;
                return el
                  ? {
                      tag: el.tagName,
                      text: el.innerText || el.getAttribute('aria-label') || '',
                      ariaLabel: el.getAttribute('aria-label'),
                      href: el.getAttribute('href'),
                    }
                  : null;
              }));
            }
            fs.writeFileSync(
              path.join(outDir, '04-mobile-drawer-focus-sequence.json'),
              JSON.stringify(focusSequence, null, 2),
            );

            await page.keyboard.press('Escape');
            await page.goto(`${server.url}/sessions/${sessionId}`);
            await expect(page.locator('.event-feed')).toBeVisible();
            await page.screenshot({ path: path.join(outDir, '05-delivery-detail-mobile.png'), fullPage: true });
            await metrics(page, '05-delivery-detail-mobile');

            await page.goto(`${server.url}/advanced`);
            await expect(page.getByRole('heading', { name: 'Dashboard' })).toBeVisible();
            await page.screenshot({ path: path.join(outDir, '06-advanced-mobile.png'), fullPage: true });
            await metrics(page, '06-advanced-mobile');
          });
          TS

      - name: Capture current UI
        run: npm exec --yes -- pnpm@10.12.1 --filter @tekon/web exec playwright test __tests__/e2e/seventh-review-capture.test.ts --project=chromium --retries=0

      - name: Archive source snapshot
        if: always()
        run: git archive --format=zip HEAD -o seventh-review-artifacts/tekon-source-at-capture.zip

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seventh-review-evidence
          path: seventh-review-artifacts
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary capture workflow
        if: always()
        run: |
          set -euo pipefail
          rm -f packages/web/__tests__/e2e/seventh-review-capture.test.ts
          git config user.name "openai-review-agent"
          git config user.email "openai-review-agent@users.noreply.github.com"
          git rm -f .github/workflows/seventh-review-capture.yml
          git commit -m "chore: remove seventh review capture workflow"
          git push origin HEAD:review/deepseek-harness-migration-2026-08-20
