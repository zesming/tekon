name: Seventh review stable capture

on:
  push:
    branches:
      - review/deepseek-harness-migration-2026-08-20

permissions:
  contents: write

jobs:
  capture:
    if: contains(github.event.head_commit.message, '[seventh-review-stable-capture]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/deepseek-harness-migration-2026-08-20
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm exec --yes -- pnpm@10.12.1 install --frozen-lockfile
      - run: npm exec --yes -- pnpm@10.12.1 --filter @tekon/core build
      - run: npm exec --yes -- pnpm@10.12.1 --filter @tekon/web exec playwright install --with-deps chromium

      - name: Create stable capture spec
        run: |
          cat > packages/web/__tests__/e2e/seventh-review-stable-capture.test.ts <<'TS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { test, expect } from './shared-fixture.js';

          test.setTimeout(90_000);
          const outDir = path.resolve(process.cwd(), '../../seventh-review-stable');
          fs.mkdirSync(outDir, { recursive: true });

          async function startRun(baseUrl: string, token: string) {
            const response = await fetch(`${baseUrl}/api/rpc`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-session-token': token },
              body: JSON.stringify({
                path: 'project.run',
                input: {
                  demandText: '第七轮稳定视觉走查：验证移动端布局与人类可读输出。',
                  template: 'standard-delivery',
                  agent: 'mock',
                  token,
                },
              }),
            });
            expect(response.ok).toBe(true);
            const body = (await response.json()) as { result: { run: { id: string }; sessionId?: string } };
            expect(body.result.sessionId).toBeTruthy();
            return { runId: body.result.run.id, sessionId: body.result.sessionId! };
          }

          async function waitForPassed(baseUrl: string, runId: string, token: string) {
            const deadline = Date.now() + 45_000;
            while (Date.now() < deadline) {
              const response = await fetch(`${baseUrl}/api/rpc`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-session-token': token },
                body: JSON.stringify({ path: 'project.overview' }),
              });
              if (response.ok) {
                const body = (await response.json()) as { result: { latestRun: { id: string; status: string } | null } };
                if (body.result.latestRun?.id === runId && body.result.latestRun.status === 'passed') return;
              }
              await new Promise((resolve) => setTimeout(resolve, 100));
            }
            throw new Error(`run ${runId} did not pass`);
          }

          async function settled(page: import('@playwright/test').Page) {
            await page.waitForTimeout(100);
            await page.evaluate(() => new Promise<void>((resolve) => requestAnimationFrame(() => requestAnimationFrame(() => resolve()))));
          }

          test('capture settled responsive surfaces', async ({ page, server, fixture }) => {
            await page.emulateMedia({ reducedMotion: 'reduce' });
            const { runId, sessionId } = await startRun(server.url, fixture.sessionToken);
            await waitForPassed(server.url, runId, fixture.sessionToken);

            await page.setViewportSize({ width: 1440, height: 1000 });
            await page.goto(server.url);
            await expect(page.getByRole('heading', { name: '受控交付' })).toBeVisible();
            await settled(page);
            await page.screenshot({ path: path.join(outDir, '01-list-desktop.png'), fullPage: true });

            await page.goto(`${server.url}/sessions/${sessionId}`);
            await expect(page.locator('.event-feed')).toBeVisible();
            await settled(page);
            await page.screenshot({ path: path.join(outDir, '02-detail-desktop.png'), fullPage: true });

            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto(server.url);
            await expect(page.getByRole('heading', { name: '受控交付' })).toBeVisible();
            await settled(page);
            await page.screenshot({ path: path.join(outDir, '03-list-mobile.png'), fullPage: true });

            await page.getByRole('button', { name: '打开导航' }).click();
            await expect(page.locator('#app-sidebar')).toBeVisible();
            await settled(page);
            await page.screenshot({ path: path.join(outDir, '04-drawer-open.png'), fullPage: true });

            await page.keyboard.press('Escape');
            await page.goto(`${server.url}/sessions/${sessionId}`);
            await expect(page.locator('.event-feed')).toBeVisible();
            await settled(page);
            await page.screenshot({ path: path.join(outDir, '05-detail-mobile.png'), fullPage: true });

            await page.goto(`${server.url}/advanced`);
            await expect(page.getByRole('heading', { name: 'Dashboard' })).toBeVisible();
            await settled(page);
            await page.screenshot({ path: path.join(outDir, '06-advanced-mobile.png'), fullPage: true });
          });
          TS

      - name: Capture settled UI
        run: npm exec --yes -- pnpm@10.12.1 --filter @tekon/web exec playwright test __tests__/e2e/seventh-review-stable-capture.test.ts --project=chromium --retries=0

      - name: Upload settled screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seventh-review-stable-screenshots
          path: seventh-review-stable
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary workflow
        if: always()
        run: |
          set -euo pipefail
          rm -f packages/web/__tests__/e2e/seventh-review-stable-capture.test.ts
          git config user.name "openai-review-agent"
          git config user.email "openai-review-agent@users.noreply.github.com"
          git rm -f .github/workflows/seventh-review-stable-capture.yml
          git commit -m "chore: remove seventh review stable capture workflow"
          git push origin HEAD:review/deepseek-harness-migration-2026-08-20
