id: bugfix
name: Bugfix
version: 1
retry:
  maxAttempts: 2
  backoffMs: 250
  strategy: fixed
# PD-21：可交付模板，按其真实门禁声明 PR 证据要求（无治理门、暂不要求验收证据）。
delivery:
  deliverable: true
  requirements:
    commandGates: [build, lint, test]
    governanceGates: []
    qaReleaseSignoff: true
    securityScan: true
    acceptanceEvidence: false
phases:
  - id: pm
    name: PM
    nodes:
      - id: pm-triage
        role: pm
        outputs:
          - demand:demand-card
        gates:
          - type: schema
            artifactType: demand-card
  - id: rd
    name: RD
    dependsOn:
      - pm
    nodes:
      - id: rd-fix
        role: rd
        inputs:
          - demand:demand-card
        outputs:
          - code:code-changes
        gates:
          - type: build
            commandRef: build
          - type: lint
            commandRef: lint
          - type: security-scan
            commandRef: security
          - type: schema
            artifactType: code-changes
  - id: qa-review
    name: QA and Reviewer
    dependsOn:
      - rd
    nodes:
      - id: qa-regression
        role: qa
        inputs:
          - demand:demand-card
          - code:code-changes
        outputs:
          - test:test-report
          - qa-release-signoff:qa-release-signoff
        gates:
          - type: test
            commandRef: test
          - type: schema
            artifactType: test-report
          - type: schema
            artifactType: qa-release-signoff
          - type: qa-signoff
            artifactType: qa-release-signoff
      - id: reviewer-review
        role: reviewer
        inputs:
          - code:code-changes
        outputs:
          - review:review-report
        gates:
          - type: human
            requiresHumanApproval: true
            # PD-18：人工驳回后对实现节点 rd-fix 发起返工，备注作为反馈。
            reworkTargetNodeId: rd-fix
  - id: pmo
    name: PMO
    dependsOn:
      - qa-review
    nodes:
      - id: pmo-delivery
        role: pmo
        inputs:
          - test:test-report
          - qa-release-signoff:qa-release-signoff
          - review:review-report
        outputs:
          - delivery:delivery-package
        gates:
          - type: schema
            artifactType: delivery-package
